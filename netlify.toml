headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[functions]

  [functions."*"]

[build]
publish = "."
publishOrigin = "default"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[[headers]]
for = "/*"

  [headers.values]
  X-Frame-Options = "DENY"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"
  Permissions-Policy = "geolocation=(), microphone=(), camera=()"

[[headers]]
for = "/service-worker.js"

  [headers.values]
  Cache-Control = "no-cache, no-store, must-revalidate"
  Content-Type = "application/javascript"

[[headers]]
for = "/manifest.json"

  [headers.values]
  Cache-Control = "public, max-age=86400"
  Content-Type = "application/manifest+json"

[[headers]]
for = "/icons/*"

  [headers.values]
  Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
for = "/*.html"

  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/"

  [headers.values]
  Cache-Control = "public, max-age=3600, must-revalidate"

# Les dossiers ci-dessous contiennent des copies techniques du site (PWA/Android).
# Ils ne doivent jamais apparaître comme des pages concurrentes dans l'index Google.
[[headers]]
for = "/www/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

[[headers]]
for = "/android/*"

  [headers.values]
  X-Robots-Tag = "noindex, nofollow"

# Consolide les anciennes copies publiques vers leur URL canonique à la racine.
[[redirects]]
from = "/www/*"
to = "/:splat"
status = 301
force = true

[[redirects]]
from = "/android/app/src/main/assets/public/*"
to = "/:splat"
status = 301
force = true

# Consolide les anciennes pages de marées plus minces vers les guides-port
# complets qui figurent déjà dans le sitemap principal.
[[redirects]]
from = "/marees-france/*"
to = "/"
status = 301
force = true

